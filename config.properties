# ===== haruka 配置 =====
# 改完直接重启程序即可；其中绝大部分项在网页控制台里改是"保存即生效"的，不用重启。

# --- 反向 WebSocket 服务端（SnowLuma 连这里）---
# 0.0.0.0 表示监听所有网卡；只本机连就写 127.0.0.1
server.host=0.0.0.0
server.port=18080
# 必填。SnowLuma 里反向 WS 的 Access Token，两边必须一致
server.access_token=CHANGE_ME

# --- 大模型 ---
# 两个协议二选一，llm.provider 决定下面 base_url 该填哪一层：
#
#   llm.provider=gemini
#     -> POST {base_url}/v1beta/models/{model}:generateContent
#        base_url 写 http://主机:端口 或 http://主机:端口/v1beta/models 都行（程序会归一化）
#        例：llm.base_url=http://127.0.0.1:8080/v1beta/models
#
#   llm.provider=openai
#     -> POST {base_url}/chat/completions
#        base_url 要写到 /v1 这一层
#        例：llm.base_url=https://api.openai.com/v1
#
llm.provider=openai
llm.base_url=https://api.openai.com/v1
llm.api_key=CHANGE_ME
llm.model=gpt-4o-mini
# ---- 人设 ----
# 两种写法可以同时用：
#   llm.system_prompt_file 指向一个 md/txt 文件（推荐）：写作体验好，
#                          改文件保存即生效，不用重启，也不用碰这个配置文件
#   llm.system_prompt      内联补充指令，会追加在文件内容后面
llm.system_prompt_file=
llm.system_prompt=你是一个 QQ 聊天机器人，说话简短自然，像真人一样，不要长篇大论，不要用 Markdown。
llm.history_limit=20
llm.temperature=0.7
# Gemini 系的思考 token 也算在这个上限里，给太小会出现"空回复"
llm.max_tokens=2048
llm.timeout_seconds=60

# --- 机器人行为 ---
# 私聊是否回复。注意：机器人自己给自己发的消息一律不回（防死循环），
# 所以这个开关只对"别人的私聊"生效，想测试得用另一个 QQ 号。
bot.private_enabled=true
# 唤醒词：正文里出现这些词就叫醒她，**不需要 @**，也不受下面 group_require_at 影响
bot.wake_words=Haruka,haruka
# 群里是否要求"被叫到"（被 @ 或命中唤醒词）；关掉等于群里每条消息都回，只适合很小的群
bot.group_require_at=true
# 同时处理几条消息。改动需要重启。
bot.workers=4

# --- 主动接话（不用 @ 也能被唤醒）---
# 便宜版：靠规则判断，不额外调模型。代价是判断不如评分模型准。
# 开了这个之后，"像提问"的群消息也可能让她主动开口。
# （唤醒词是另一条独立的路，永远生效，不受这里影响）
bot.proactive_enabled=false
# 只对"像提问"的消息主动接话；设 false 则任何群消息都可能（务必配合下面的限流）
bot.proactive_on_question=true
# 同一个群两次主动开口至少隔多少秒
bot.proactive_cooldown_seconds=60
# 同一个群每小时最多主动开口几次
bot.proactive_max_per_hour=6

# --- 控制接口（与机器人本体解耦，可以只跑其中一边）---
# web.enabled=false  ->  纯机器人进程，一个 HTTP 端口都不开
# --web-only 启动参数  ->  只跑控制接口，不连 SnowLuma、不占 QQ 端口
web.enabled=true
# 只监听本机。要从别的机器打开就改成 0.0.0.0 —— 但那样必须同时设置 web.secret，
# 否则程序会拒绝启动（控制接口能读到你的 API Key、也能改写配置）。
web.host=127.0.0.1
web.port=18081
# 控制台密钥，请求带 Authorization: Bearer <这个值>。留空 = 本机不校验。
web.secret=
# 静态页面目录。页面（webui/index.html）是独立文件，可以放在任何地方托管；
# 这里指对了，后端就会把它一起提供出来。留空 = 只提供 API，不提供页面。
web.static_dir=webui

# --- 长期记忆（SQLite）---
# 只存"关键记忆"（关于某人/某群的稳定事实），不存聊天历史 —— 重启后记得事，但不记得上一句。
#
# 迁移：只需要带三样东西 ——
#   data/haruka.db      她记住的事
#   haruka.md           她是谁
#   config.properties   怎么找到她（API Key 与规则）
# 头像缓存（data/avatars）和画过的图（data/images）**不用带**，那是可丢弃的缓存，
# 到了新机器会自己重建。
memory.enabled=true
# 相对路径基于运行目录，方便整个文件夹搬走
memory.db_path=data/haruka.db
# 每次请求最多把几条记忆拼进 prompt。调大更"记得住"，但更费 token。
memory.inject_limit=8
# 每轮对话后让她自己判断有没有值得长期记住的事。关掉就只靠控制台手动维护。
# 注意：抽不抽由她决定，提示词的默认答案是"不记"。
memory.extract_enabled=true
# 短于这个字数的用户消息不触发抽取，省掉"嗯""哈哈"这种无意义调用
memory.extract_min_chars=6
# 重要性门槛：她自己给每条候选打 0-1 分，低于这个分数一律不写进记忆。
# 调高 = 她更挑；调到 0.9 基本只记"非常重要"的。
memory.min_importance=0.7
# 对方明确要求"记住"的触发词：命中就**一定**落一条，且绕开上面的门槛。
# 她常顺口回"已经记好啦"，这句话必须是真的，不能嘴上答应而库里没有。
memory.remember_keywords=记住,记一下,别忘了,记得,帮我记,帮我记住
# 每个会话最多留多少条（安全阀，不是主要控制手段）
memory.max_per_scope=300

# --- 画图 ---
# 模型在回复里用 [[draw: 英文画面描述]] 点单，系统把标记替换成图片发出去。
# 这段能力说明由程序追加，不用你写进人设文件。
image.enabled=true
# 生图模型。实测 gemini-3.1-flash-image 可用（一次约 17 秒，1024x1024）
# 注意：画图走的是 Gemini 的 generateContent 端点，用的是上面的 llm.base_url。
# 所以 llm.provider=openai 时，除非那个 base_url 也提供 Gemini 端点，画图会失败。
image.model=gemini-3.1-flash-image
# 图片存哪。和记忆库一样用相对路径，方便整个目录搬走
image.save_dir=data/images
# 追加到每张图提示词后面的风格描述，逗号分隔。留空则只用模型自己写的那句
image.style=
# 怎么把图发给 OneBot：file = 发本地路径（消息小）；base64 = 兼容性更好但消息大三分之一
image.send_mode=file
# 生图慢，超时给宽一点
image.timeout_seconds=180
# 一轮对话最多画几张，防止模型反复发标记
image.max_per_turn=2

# --- 头像 ---
# OneBot 的消息事件里**只有文字、不含头像图片**；但 QQ 头像地址是纯拼接的固定地址，
# 不用调任何接口：https://q1.qlogo.cn/g?b=qq&nk=<QQ号>&s=<尺寸>
# 消息里命中下面这些词时，抓发送者头像附给模型，她这才算真的"看得见"。
# 画图时她也可以点名 [[draw: 描述 | avatar]] 把头像当参考图。
avatar.enabled=true
avatar.look_keywords=头像,长相,样子,照片,自拍
# qlogo 的尺寸档位，常见值 40 / 100 / 140 / 640
avatar.size=640
# 同一张头像多久内不重复下载（分钟）
avatar.cache_minutes=30
avatar.cache_dir=data/avatars
avatar.timeout_seconds=20
